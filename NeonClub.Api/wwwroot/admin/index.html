<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Club — Админка</title>
    <link rel="stylesheet" href="admin.css" />
</head>
<body>
    <div class="container">
        <header class="admin-header">
            <h1 class="admin-header__title">Neon<em>Club</em> · Admin</h1>
            <span class="admin-header__badge">● Панель управления</span>
        </header>

        <div class="login-bar">
            <input id="emailInput" type="email" placeholder="admin@neon.club" />
            <input id="passInput" type="password" placeholder="Пароль" />
            <button id="loginBtn" class="btn btn--primary">Войти</button>
            <span id="keyError" class="error"></span>
        </div>

        <div id="content" class="hidden">
            <section class="admin-section">
                <div class="admin-section__head">
                    <h2 class="admin-section__title">Пользователи</h2>
                </div>
                <div class="table-wrap">
                    <table id="usersTable">
                        <thead>
                            <tr>
                                <th>Имя</th>
                                <th>Email</th>
                                <th>Роль</th>
                                <th>Броней</th>
                                <th>Создан</th>
                                <th>Действие</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="admin-section">
                <div class="admin-section__head">
                    <h2 class="admin-section__title">Брони</h2>
                </div>
                <div class="table-wrap">
                    <table id="bookingsTable">
                        <thead>
                            <tr>
                                <th>Зона</th>
                                <th>Пользователь</th>
                                <th>Часов</th>
                                <th>Сумма</th>
                                <th>Статус</th>
                                <th>Создана</th>
                                <th>Действие</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="admin-section">
                <div class="admin-section__head">
                    <h2 class="admin-section__title">Загрузка изображения</h2>
                </div>
                <div class="upload-bar">
                    <select id="zoneSelect"></select>
                    <input type="file" id="fileInput" accept="image/*" />
                    <button id="uploadBtn" class="btn btn--primary btn--sm">Загрузить</button>
                    <span id="uploadStatus" class="error"></span>
                </div>
            </section>

            <section class="admin-section">
                <div class="admin-section__head">
                    <h2 class="admin-section__title">Галерея</h2>
                </div>
                <div id="gallery" class="gallery"></div>
            </section>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
